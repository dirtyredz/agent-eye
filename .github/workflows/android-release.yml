name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: agent-eye-android-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Validate untrusted tag syntax before checkout
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - id: commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node src/android/releases/cli/cli.mjs validate-tag --execute
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  gate:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}
  build:
    needs: [validate, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          build_tools=$(node --input-type=module -e "import { BUILD_TOOLS_VERSION } from './src/android/tooling/android-tools.mjs'; console.log(BUILD_TOOLS_VERSION)")
          sdkmanager 'platforms;android-36' "build-tools;$build_tools"
      - run: bash android/gradlew -p android assembleRelease bundleRelease lintRelease releaseTools --no-daemon
      - run: node src/android/releases/cli/cli.mjs stage --execute
      - id: artifact
        env:
          BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
        run: echo "name=unsigned-$BUILD_COMMIT-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          include-hidden-files: true # The explicit public staging directory is under .tmp.
          path: |
            .tmp/release-stage/agent-eye-unsigned.apk
            .tmp/release-stage/agent-eye-unsigned.aab
            .tmp/release-stage/release-unsigned.json
            .tmp/release-stage/mapping.txt
          if-no-files-found: error
          retention-days: 90
  draft:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .tmp/release-stage
      - run: node src/android/releases/cli/cli.mjs draft --execute
