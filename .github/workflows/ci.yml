name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          build_tools=$(node --input-type=module -e "import { BUILD_TOOLS_VERSION } from './src/android/tooling/android-tools.mjs'; console.log(BUILD_TOOLS_VERSION)")
          sdkmanager 'platforms;android-36' "build-tools;$build_tools"
      - run: npm ci
      - run: node --test
      - run: bash android/gradlew -p android ktlintCheck assembleDebug testDebugUnitTest --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/**/build/reports/
          retention-days: 7
